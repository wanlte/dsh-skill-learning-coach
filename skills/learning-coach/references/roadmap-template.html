<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TOPIC}} · 学习路线</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1d2129;--dim:#6b7280;--line:#e5e7eb;--accent:#2563eb;--done:#15803d;--gap:#b91c1c;--draft:#b45309;--known:#6b7280}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#191c23;--ink:#e8eaed;--dim:#9aa0aa;--line:#2a2f3a;--accent:#6ea8ff;--done:#4ade80;--gap:#f87171;--draft:#fbbf24;--known:#9aa0aa}}
*{box-sizing:border-box}
body{margin:0;padding:28px 16px 48px;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:880px;margin:0 auto}
header{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
h1{margin:0 0 6px;font-size:22px;letter-spacing:.2px}
.sub{color:var(--dim);font-size:13px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--dim)}
.chip b{color:var(--ink);font-weight:600}
.bar{margin-top:16px;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.progress{font-size:12.5px;color:var(--dim);margin:8px 0 0}
ol.nodes{list-style:none;margin:18px 0 0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li.node{padding:14px 18px;border-bottom:1px solid var(--line)}
li.node:last-child{border-bottom:0}
li.node[data-depth="1"]{padding-left:34px}
li.node[data-depth="2"]{padding-left:50px}
li.node[data-depth="3"]{padding-left:66px}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.id{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px}
.title{font-weight:600}
.tag{font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--dim)}
.tag.s-done{color:var(--done);border-color:var(--done)}
.tag.s-gap{color:var(--gap);border-color:var(--gap)}
.tag.s-drafted{color:var(--draft);border-color:var(--draft)}
.tag.cur{color:#fff;background:var(--accent);border-color:var(--accent)}
.mastery{margin:6px 0 0;color:var(--dim);font-size:13.5px}
.mastery.none{font-style:italic}
.meta{margin:6px 0 0;color:var(--dim);font-size:12.5px}
footer{color:var(--dim);font-size:12.5px;margin-top:18px;line-height:1.8}
footer code{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>{{TOPIC}}</h1>
  <p class="sub">{{PURPOSE}} · 期限 {{DEADLINE}} · 每周 {{WEEKLY}} 分钟 · 方法 {{METHOD}}</p>
  <div class="chips">
    <span class="chip">共 <b>{{TOTAL}}</b> 节</span>
    <span class="chip">已过 <b>{{DONE}}</b> 节</span>
    <span class="chip">带缺口 <b>{{GAP}}</b> 节</span>
    <span class="chip">当前 <b>{{CURRENT}}</b></span>
  </div>
  <div class="bar"><span style="width:{{PERCENT}}%"></span></div>
  <p class="progress">{{DONE}} / {{TOTAL}} 节走完无提示产出</p>
</header>

<ol class="nodes">
{{ROWS}}
</ol>

<footer>
  数据源：<code>{{SOURCE}}</code>（以它为准，这一页只是渲染快照）<br>
  生成时间：{{GENERATED_AT}} · 编辑请回到设置 → 学习路线；改完重开这一页
</footer>
</div>
</body>
</html>
